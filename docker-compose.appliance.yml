name: aast-ai-agent

services:
  appliance:
    build:
      context: .
      dockerfile: appliance/Dockerfile
      args:
        VITE_API_BASE: /api
    image: aast-ai-agent/appliance:local
    container_name: aast-ai-agent-appliance
    env_file:
      - path: ./appliance/.env.appliance.local
        required: true
    environment:
      NODE_ENV: production
      AAST_LAUNCHER_MODE: full
      NODE_OPTIONS: ${NODE_OPTIONS:---max-old-space-size=4096}
      ORCHESTRATOR_PORT: 8004
      DECISION_API_URL: http://127.0.0.1:8005
      DATABASE_URL: sqlite:////opt/aast/decision/runtime/dev.db
      VOICE_ENABLED: "false"
      VOICE_TEMP_DIR: /opt/aast/decision/runtime/voice
      RAG_BASE_URL: http://127.0.0.1:8001
      RAG_RETRIEVER_URL: http://127.0.0.1:8001
      RAG_RETRIEVER_HEALTH_URL: http://127.0.0.1:8001/health
      RAG_ANSWER_URL: http://127.0.0.1:8002
      RAG_ANSWER_ENGINE_ENABLED: ${RAG_ANSWER_ENGINE_ENABLED:-false}
      RAG_TIMEOUT_MS: ${RAG_TIMEOUT_MS:-60000}
      RAG_COLD_START_TIMEOUT_MS: ${RAG_COLD_START_TIMEOUT_MS:-120000}
      RAG_ROUTE_TIMEOUT_MS: ${RAG_ROUTE_TIMEOUT_MS:-70000}
      HYBRID_ROUTE_TIMEOUT_MS: ${HYBRID_ROUTE_TIMEOUT_MS:-70000}
      RAG_SYNTHETIC_PROBES_ENABLED: ${RAG_SYNTHETIC_PROBES_ENABLED:-false}
      QDRANT_HOST: 127.0.0.1
      QDRANT_PORT: 6333
      RAG_COLLECTION_NAME: aast_academic_rag_production
      RAG_EMBEDDING_INIT_MODE: ${RAG_EMBEDDING_INIT_MODE:-eager}
      RAG_EMBEDDING_DEVICE: cpu
      RAG_EMBED_BATCH_SIZE: ${RAG_EMBED_BATCH_SIZE:-4}
      RAG_TORCH_NUM_THREADS: ${RAG_TORCH_NUM_THREADS:-4}
      RAG_HEALTH_REQUIRES_EMBEDDING: "true"
      RAG_LOW_CPU_MEM_USAGE: "true"
      RAG_EMBEDDING_DYNAMIC_QUANTIZE: "false"
      TOKENIZERS_PARALLELISM: "false"
      OMP_NUM_THREADS: ${RAG_TORCH_NUM_THREADS:-4}
      MKL_NUM_THREADS: ${RAG_TORCH_NUM_THREADS:-4}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      KG_EMBED_MODEL: ${KG_EMBED_MODEL:-nomic-embed-text}
      KG_EMBED_STARTUP_TIMEOUT_MS: ${KG_EMBED_STARTUP_TIMEOUT_MS:-90000}
      KG_ROUTE_TIMEOUT_MS: ${KG_ROUTE_TIMEOUT_MS:-12000}
      KG_SEMAPHORE_ACQUIRE_TIMEOUT_MS: ${KG_SEMAPHORE_ACQUIRE_TIMEOUT_MS:-3000}
      SINGLE_GEMMA_GENERATION_MODE: "true"
      GEMINI_BACKUP_ENABLED: "false"
      PRIMARY_MODEL: ${PRIMARY_MODEL:-gemma4:e2b}
      PRIMARY_TIMEOUT_MS: ${PRIMARY_TIMEOUT_MS:-60000}
      SYNTHESIS_TIMEOUT_MS: ${SYNTHESIS_TIMEOUT_MS:-60000}
      PRIMARY_COLD_START_TIMEOUT_MS: ${PRIMARY_COLD_START_TIMEOUT_MS:-90000}
      MODEL_PRELOAD_TIMEOUT_MS: ${MODEL_PRELOAD_TIMEOUT_MS:-90000}
      LLM_REQUEST_DEADLINE_MS: ${LLM_REQUEST_DEADLINE_MS:-60000}
      SYNTHESIS_DEADLINE_MS: ${SYNTHESIS_DEADLINE_MS:-60000}
      HEALTHCHECK_TIMEOUT_MS: ${HEALTHCHECK_TIMEOUT_MS:-25000}
      NEO4J_URI: bolt://127.0.0.1:7687
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:?NEO4J_PASSWORD is required}
      NEO4J_DATABASE: ${NEO4J_DATABASE:-neo4j}
      NEO4J_dbms_default__database: ${NEO4J_DATABASE:-neo4j}
      NEO4J_server_memory_heap_initial__size: ${NEO4J_HEAP_INITIAL:-256m}
      NEO4J_server_memory_heap_max__size: ${NEO4J_HEAP_MAX:-512m}
      NEO4J_server_memory_pagecache_size: ${NEO4J_PAGECACHE:-256m}
      LOG_DIR: /opt/aast/backend/logs
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - backend_data:/opt/aast/backend/data
      - backend_logs:/opt/aast/backend/logs
      - decision_data:/opt/aast/decision/runtime
      - decision_whisper_cache:/root/.cache/whisper
      - qdrant_data:/opt/qdrant/storage
      - rag_hf_cache:/root/.cache/huggingface
      - rag_torch_cache:/root/.cache/torch
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_import:/var/lib/neo4j/import
      - neo4j_plugins:/plugins
    restart: unless-stopped
    stop_grace_period: 90s
    # The appliance does not use multi-process shared-memory workloads. Keeping
    # /dev/shm bounded avoids a 2 GiB reservation during WSL container startup.
    shm_size: 512mb

volumes:
  backend_data:
    name: aast-ai-agent_backend_data
  backend_logs:
    name: aast-ai-agent_backend_logs
  decision_data:
    name: aast-ai-agent_decision_data
  decision_whisper_cache:
    name: aast-ai-agent_decision_whisper_cache
  qdrant_data:
    name: aast-ai-agent_qdrant_data
  rag_hf_cache:
    name: aast-ai-agent_rag_hf_cache
  rag_torch_cache:
    name: aast-ai-agent_rag_torch_cache
  neo4j_data:
    name: aast-ai-agent_neo4j_data
  neo4j_logs:
    name: aast-ai-agent_neo4j_logs
  neo4j_import:
    name: aast-ai-agent_neo4j_import
  neo4j_plugins:
    name: aast-ai-agent_neo4j_plugins
