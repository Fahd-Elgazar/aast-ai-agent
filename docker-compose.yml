name: aast-ai-agent

services:
  frontend:
    build:
      context: ./aast-ai-agent-main/frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE: /api
    image: aast-ai-agent/frontend:local
    depends_on:
      backend:
        condition: service_started
    ports:
      - "127.0.0.1:5173:5173"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5173/ >/dev/null || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - ai-agent-net

  backend:
    build:
      context: ./aast-ai-agent-main/backend
      dockerfile: Dockerfile
    image: aast-ai-agent/backend:local
    env_file:
      - ./aast-ai-agent-main/backend/.env
    environment:
      NODE_ENV: production
      NODE_OPTIONS: ${NODE_OPTIONS:---max-old-space-size=4096}
      ORCHESTRATOR_PORT: 8004
      DECISION_API_URL: http://decision-api:8005
      RAG_BASE_URL: http://rag-retriever:8001
      RAG_RETRIEVER_URL: http://rag-retriever:8001
      RAG_ANSWER_URL: http://rag-answer:8002
      RAG_TIMEOUT_MS: ${RAG_TIMEOUT_MS:-60000}
      RAG_COLD_START_TIMEOUT_MS: ${RAG_COLD_START_TIMEOUT_MS:-120000}
      RAG_ROUTE_TIMEOUT_MS: ${RAG_ROUTE_TIMEOUT_MS:-70000}
      HYBRID_ROUTE_TIMEOUT_MS: ${HYBRID_ROUTE_TIMEOUT_MS:-70000}
      RAG_SYNTHETIC_PROBES_ENABLED: ${RAG_SYNTHETIC_PROBES_ENABLED:-false}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      SINGLE_GEMMA_GENERATION_MODE: ${SINGLE_GEMMA_GENERATION_MODE:-true}
      GEMINI_BACKUP_ENABLED: ${GEMINI_BACKUP_ENABLED:-true}
      PRIMARY_MODEL: ${PRIMARY_MODEL:-gemma4:e2b}
      PRIMARY_TIMEOUT_MS: ${PRIMARY_TIMEOUT_MS:-60000}
      SYNTHESIS_TIMEOUT_MS: ${SYNTHESIS_TIMEOUT_MS:-60000}
      PRIMARY_COLD_START_TIMEOUT_MS: ${PRIMARY_COLD_START_TIMEOUT_MS:-90000}
      MODEL_PRELOAD_TIMEOUT_MS: ${MODEL_PRELOAD_TIMEOUT_MS:-90000}
      LLM_REQUEST_DEADLINE_MS: ${LLM_REQUEST_DEADLINE_MS:-60000}
      SYNTHESIS_DEADLINE_MS: ${SYNTHESIS_DEADLINE_MS:-60000}
      HEALTHCHECK_TIMEOUT_MS: ${HEALTHCHECK_TIMEOUT_MS:-25000}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in .env}
      NEO4J_DATABASE: ${NEO4J_DATABASE:-neo4j}
      INTERNAL_SECRET_KEY: ${INTERNAL_SECRET_KEY:?Set INTERNAL_SECRET_KEY in .env}
      LOG_DIR: /app/logs
    depends_on:
      neo4j:
        condition: service_healthy
      decision-api:
        condition: service_healthy
      rag-retriever:
        condition: service_healthy
      rag-answer:
        condition: service_started
    ports:
      - "127.0.0.1:8004:8004"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - backend_logs:/app/logs
      - backend_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:8004/health').then(r=>process.exit(r.status < 500 ? 0 : 1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 6
      start_period: 90s
    networks:
      - ai-agent-net

  decision-api:
    build:
      context: ./college-decision-system-backend
      dockerfile: Dockerfile
    image: aast-ai-agent/decision-api:local
    env_file:
      - ./college-decision-system-backend/.env
    environment:
      HOST: 0.0.0.0
      PORT: 8005
      DATABASE_URL: sqlite:////app/runtime/dev.db
      VOICE_TEMP_DIR: /app/runtime/voice
      INTERNAL_SECRET_KEY: ${INTERNAL_SECRET_KEY:?Set INTERNAL_SECRET_KEY in .env}
    ports:
      - "127.0.0.1:8005:8005"
    volumes:
      - decision_data:/app/runtime
      - decision_whisper_cache:/root/.cache/whisper
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8005/health', timeout=5).read()\""]
      interval: 20s
      timeout: 8s
      retries: 8
      start_period: 60s
    networks:
      - ai-agent-net

  rag-retriever:
    build:
      context: ./aast-ai-agent-main/backend/rag_system
      dockerfile: Dockerfile.retriever
    image: aast-ai-agent/rag-retriever:local
    environment:
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      RAG_COLLECTION_NAME: aast_academic_rag_production
      RAG_EMBEDDING_INIT_MODE: ${RAG_EMBEDDING_INIT_MODE:-eager}
      RAG_EMBEDDING_DEVICE: ${RAG_EMBEDDING_DEVICE:-cpu}
      RAG_EMBED_BATCH_SIZE: ${RAG_EMBED_BATCH_SIZE:-4}
      RAG_TORCH_NUM_THREADS: ${RAG_TORCH_NUM_THREADS:-4}
      RAG_HEALTH_REQUIRES_EMBEDDING: ${RAG_HEALTH_REQUIRES_EMBEDDING:-true}
      RAG_LOW_CPU_MEM_USAGE: ${RAG_LOW_CPU_MEM_USAGE:-true}
      RAG_EMBEDDING_DYNAMIC_QUANTIZE: ${RAG_EMBEDDING_DYNAMIC_QUANTIZE:-false}
      TOKENIZERS_PARALLELISM: "false"
      OMP_NUM_THREADS: ${RAG_TORCH_NUM_THREADS:-4}
      MKL_NUM_THREADS: ${RAG_TORCH_NUM_THREADS:-4}
    depends_on:
      qdrant:
        condition: service_healthy
    ports:
      - "127.0.0.1:8001:8001"
    volumes:
      - rag_hf_cache:/root/.cache/huggingface
      - rag_torch_cache:/root/.cache/torch
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=5).read()\""]
      interval: 30s
      timeout: 8s
      retries: 8
      start_period: 120s
    networks:
      - ai-agent-net

  rag-answer:
    build:
      context: ./aast-ai-agent-main/backend/rag_system
      dockerfile: Dockerfile.answer
    image: aast-ai-agent/rag-answer:local
    environment:
      RAG_RETRIEVER_URL: http://rag-retriever:8001
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      RAG_ANSWER_ENGINE_ENABLED: ${RAG_ANSWER_ENGINE_ENABLED:-false}
      RAG_ANSWER_MODEL: ${RAG_ANSWER_MODEL:-gemma4:e2b}
      RAG_ANSWER_TIMEOUT_SECONDS: ${RAG_ANSWER_TIMEOUT_SECONDS:-180}
      RAG_RETRIEVER_TIMEOUT_SECONDS: ${RAG_RETRIEVER_TIMEOUT_SECONDS:-180}
      RAG_ANSWER_HEALTH_TIMEOUT_SECONDS: ${RAG_ANSWER_HEALTH_TIMEOUT_SECONDS:-8}
    depends_on:
      rag-retriever:
        condition: service_healthy
    ports:
      - "127.0.0.1:8002:8002"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/health', timeout=8).read()\""]
      interval: 30s
      timeout: 10s
      retries: 8
      start_period: 60s
    networks:
      - ai-agent-net

  qdrant:
    image: qdrant/qdrant:v1.12.5
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "bash -ec 'exec 3<>/dev/tcp/127.0.0.1/6333'"]
      interval: 20s
      timeout: 5s
      retries: 8
      start_period: 30s
    networks:
      - ai-agent-net

  neo4j:
    image: neo4j:5.26-community
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in .env}
      NEO4J_dbms_default__database: ${NEO4J_DATABASE:-neo4j}
      NEO4J_server_memory_heap_initial__size: ${NEO4J_HEAP_INITIAL:-512m}
      NEO4J_server_memory_heap_max__size: ${NEO4J_HEAP_MAX:-1G}
      NEO4J_server_memory_pagecache_size: ${NEO4J_PAGECACHE:-512m}
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_import:/var/lib/neo4j/import
      - neo4j_plugins:/plugins
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u ${NEO4J_USER:-neo4j} -p ${NEO4J_PASSWORD:-12345678} 'RETURN 1' >/dev/null 2>&1 || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 12
      start_period: 60s
    networks:
      - ai-agent-net

networks:
  ai-agent-net:
    driver: bridge

volumes:
  backend_data:
  backend_logs:
  decision_data:
  decision_whisper_cache:
  qdrant_data:
  rag_hf_cache:
  rag_torch_cache:
  neo4j_data:
  neo4j_logs:
  neo4j_import:
  neo4j_plugins:
