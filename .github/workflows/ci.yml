name: CI

on:
  push:
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aast-ai-agent-main/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: aast-ai-agent-main/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aast-ai-agent-main/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: aast-ai-agent-main/backend/package-lock.json
      - run: npm ci
      - run: npm run test:health
      - run: npm run test:kg
      - run: npm run test:topology
      - run: npm run test:auth
      - run: npm run test:admin-proxy
      - run: npm run test:golden-cache
      - run: npm run test:routing

  decision-api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: college-decision-system-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements-dev.txt
      - name: Run hermetic migrated-database delivery gate
        run: python scripts/run_delivery_checks.py
